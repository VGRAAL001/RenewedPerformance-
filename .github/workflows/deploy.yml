name: Deploy to GitHub Pages

on:
  push:
    branches: [working]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyA07aZ_PRuWqWasDjbUNmnF9VJzUDE_ORo
          VITE_FIREBASE_AUTH_DOMAIN: renewedperformance-d8388.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: renewedperformance-d8388
          VITE_FIREBASE_STORAGE_BUCKET: renewedperformance-d8388.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 227086580754
          VITE_FIREBASE_APP_ID: 1:227086580754:web:bf53fc11ab8c59d47f6ccb
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
